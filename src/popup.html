<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="appName">きもち記録</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1 class="popup__title" data-i18n="popup_title">今のきもちは?</h1>
        <p class="popup__subtitle" data-i18n="popup_subtitle">
          絵文字をタップして記録しよう
        </p>
      </header>

      <section class="emoji-picker" aria-labelledby="emoji-picker-label">
        <h2 id="emoji-picker-label" class="visually-hidden" data-i18n="popup_title">
          今のきもちは?
        </h2>
        <ul class="emoji-picker__list" role="radiogroup">
          <li>
            <button
              type="button"
              class="emoji-btn"
              role="radio"
              aria-checked="false"
              data-emoji="happy"
              data-i18n-attr="aria-label:emoji_happy,title:emoji_happy"
            >
              <span class="emoji-btn__icon" aria-hidden="true">😊</span>
              <span class="emoji-btn__label" data-i18n="emoji_happy">うれしい</span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="emoji-btn"
              role="radio"
              aria-checked="false"
              data-emoji="calm"
              data-i18n-attr="aria-label:emoji_calm,title:emoji_calm"
            >
              <span class="emoji-btn__icon" aria-hidden="true">😌</span>
              <span class="emoji-btn__label" data-i18n="emoji_calm">おだやか</span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="emoji-btn"
              role="radio"
              aria-checked="false"
              data-emoji="tired"
              data-i18n-attr="aria-label:emoji_tired,title:emoji_tired"
            >
              <span class="emoji-btn__icon" aria-hidden="true">😪</span>
              <span class="emoji-btn__label" data-i18n="emoji_tired">つかれた</span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="emoji-btn"
              role="radio"
              aria-checked="false"
              data-emoji="sad"
              data-i18n-attr="aria-label:emoji_sad,title:emoji_sad"
            >
              <span class="emoji-btn__icon" aria-hidden="true">😢</span>
              <span class="emoji-btn__label" data-i18n="emoji_sad">かなしい</span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="emoji-btn"
              role="radio"
              aria-checked="false"
              data-emoji="angry"
              data-i18n-attr="aria-label:emoji_angry,title:emoji_angry"
            >
              <span class="emoji-btn__icon" aria-hidden="true">😠</span>
              <span class="emoji-btn__label" data-i18n="emoji_angry">いらいら</span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="emoji-btn"
              role="radio"
              aria-checked="false"
              data-emoji="anxious"
              data-i18n-attr="aria-label:emoji_anxious,title:emoji_anxious"
            >
              <span class="emoji-btn__icon" aria-hidden="true">😰</span>
              <span class="emoji-btn__label" data-i18n="emoji_anxious">ふあん</span>
            </button>
          </li>
        </ul>
      </section>

      <section class="note">
        <label for="note-input" class="visually-hidden" data-i18n="popup_note_placeholder">
          メモ (任意)
        </label>
        <textarea
          id="note-input"
          class="note__input"
          rows="2"
          maxlength="200"
          data-i18n-attr="placeholder:popup_note_placeholder"
          placeholder="メモ (任意)"
        ></textarea>
      </section>

      <div class="actions">
        <button
          type="button"
          id="save-btn"
          class="btn btn--primary"
          data-i18n="popup_save"
          disabled
        >
          保存
        </button>
        <p
          id="save-status"
          class="actions__status"
          role="status"
          aria-live="polite"
        ></p>
      </div>

      <section class="today" aria-labelledby="today-heading">
        <h2 id="today-heading" class="section-title" data-i18n="popup_today">
          今日の記録
        </h2>
        <ul id="today-list" class="today__list"></ul>
        <p
          id="today-empty"
          class="today__empty"
          data-i18n="popup_no_records"
          hidden
        >
          まだ記録がありません
        </p>
      </section>

      <section class="weekly" aria-labelledby="weekly-heading">
        <h2 id="weekly-heading" class="section-title" data-i18n="weekly_title">
          今週のきもち
        </h2>
        <dl id="weekly-summary" class="weekly__summary">
          <div class="weekly__row">
            <dt data-i18n="weekly_total">記録回数</dt>
            <dd id="weekly-total">0</dd>
          </div>
          <div
            id="weekly-top-row"
            class="weekly__row"
            hidden
          >
            <dt data-i18n="weekly_top_emotion">一番多いきもち</dt>
            <dd id="weekly-top"></dd>
          </div>
        </dl>
        <ul id="weekly-days" class="weekly__days">
          <li class="weekly__day" data-day="mon">
            <span class="weekly__day-label" data-i18n="day_mon">月</span>
            <span class="weekly__day-count">0</span>
            <div class="weekly__bar" aria-hidden="true" style="--ratio: 0"></div>
          </li>
          <li class="weekly__day" data-day="tue">
            <span class="weekly__day-label" data-i18n="day_tue">火</span>
            <span class="weekly__day-count">0</span>
            <div class="weekly__bar" aria-hidden="true" style="--ratio: 0"></div>
          </li>
          <li class="weekly__day" data-day="wed">
            <span class="weekly__day-label" data-i18n="day_wed">水</span>
            <span class="weekly__day-count">0</span>
            <div class="weekly__bar" aria-hidden="true" style="--ratio: 0"></div>
          </li>
          <li class="weekly__day" data-day="thu">
            <span class="weekly__day-label" data-i18n="day_thu">木</span>
            <span class="weekly__day-count">0</span>
            <div class="weekly__bar" aria-hidden="true" style="--ratio: 0"></div>
          </li>
          <li class="weekly__day" data-day="fri">
            <span class="weekly__day-label" data-i18n="day_fri">金</span>
            <span class="weekly__day-count">0</span>
            <div class="weekly__bar" aria-hidden="true" style="--ratio: 0"></div>
          </li>
          <li class="weekly__day" data-day="sat">
            <span class="weekly__day-label" data-i18n="day_sat">土</span>
            <span class="weekly__day-count">0</span>
            <div class="weekly__bar" aria-hidden="true" style="--ratio: 0"></div>
          </li>
          <li class="weekly__day" data-day="sun">
            <span class="weekly__day-label" data-i18n="day_sun">日</span>
            <span class="weekly__day-count">0</span>
            <div class="weekly__bar" aria-hidden="true" style="--ratio: 0"></div>
          </li>
        </ul>
        <p
          id="weekly-empty"
          class="weekly__empty"
          data-i18n="popup_no_records"
          hidden
        >
          まだ記録がありません
        </p>
        <div class="weekly__share">
          <button
            type="button"
            id="share-parent-btn"
            class="btn btn--secondary"
            data-i18n="parent_share_button"
            disabled
          >
            保護者に共有
          </button>
          <p
            id="share-parent-hint"
            class="weekly__share-hint"
            role="note"
            hidden
          ></p>
        </div>
      </section>

      <footer class="popup__footer">
        <button
          type="button"
          id="open-options"
          class="btn btn--link"
          data-i18n="options_title"
        >
          設定
        </button>
      </footer>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
