<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="options_title">設定</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="options">
      <header class="options__header">
        <h1 class="options__title" data-i18n="options_title">設定</h1>
      </header>

      <section class="card" aria-labelledby="sec-notification">
        <h2 id="sec-notification" class="card__title" data-i18n="options_notification">
          通知
        </h2>

        <div class="field field--row">
          <label class="switch" for="opt-notif-enabled">
            <input
              type="checkbox"
              id="opt-notif-enabled"
              data-i18n-attr="aria-label:options_notification_enable"
              aria-label="リマインダー通知を有効にする"
            />
            <span class="switch__label" data-i18n="options_notification_enable">
              リマインダー通知を有効にする
            </span>
          </label>
        </div>

        <div class="field">
          <label
            class="field__label"
            for="opt-notif-times"
            data-i18n="options_notification_times"
          >
            通知時刻
          </label>
          <input
            type="text"
            id="opt-notif-times"
            class="input"
            inputmode="numeric"
            placeholder="09:00, 13:00, 20:00"
            data-i18n-attr="aria-label:options_notification_times"
            aria-label="通知時刻"
            aria-describedby="opt-notif-times-hint"
          />
          <p id="opt-notif-times-hint" class="field__hint">
            HH:MM, HH:MM ...
          </p>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-parent">
        <h2 id="sec-parent" class="card__title" data-i18n="options_parent_share">
          保護者への共有
        </h2>

        <div class="field">
          <label
            class="field__label"
            for="opt-parent-email"
            data-i18n="options_parent_email"
          >
            保護者のメールアドレス
          </label>
          <input
            type="email"
            id="opt-parent-email"
            class="input"
            autocomplete="off"
            placeholder="parent@domain.test"
            data-i18n-attr="aria-label:options_parent_email"
            aria-label="保護者のメールアドレス"
          />
        </div>

        <div class="field field--row">
          <label class="switch" for="opt-weekly-enabled">
            <input
              type="checkbox"
              id="opt-weekly-enabled"
              data-i18n-attr="aria-label:options_weekly_summary"
              aria-label="週次サマリー"
            />
            <span class="switch__label" data-i18n="options_weekly_summary">
              週次サマリー
            </span>
          </label>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-premium">
        <h2 id="sec-premium" class="card__title" data-i18n="premium_title">
          プレミアム機能
        </h2>
        <p
          id="opt-premium-status"
          class="field__hint"
          role="status"
          aria-live="polite"
        ></p>
        <p
          id="opt-premium-desc"
          class="field__hint"
          data-i18n="premium_desc"
        >詳細統計・無制限記録・カスタマイズ拡張をアンロック</p>
        <p
          id="opt-premium-price"
          class="field__hint"
          data-i18n="premium_price"
        >$3 USD 買い切り</p>
        <div class="field field--row field--wrap">
          <button
            type="button"
            id="opt-premium-trial"
            class="btn btn--secondary"
            data-i18n="premium_trial_start"
            data-i18n-attr="aria-label:premium_trial_start"
            aria-label="7日間無料で試す"
            hidden
          >7日間無料で試す</button>
          <button
            type="button"
            id="opt-premium-unlock"
            class="btn btn--primary"
            data-i18n="premium_unlock"
            data-i18n-attr="aria-label:premium_unlock"
            aria-label="アンロックする"
            hidden
          >アンロックする</button>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-data">
        <h2 id="sec-data" class="card__title" data-i18n="popup_history">
          データ
        </h2>

        <div class="field field--row field--wrap">
          <button
            type="button"
            id="btn-export"
            class="btn btn--secondary"
            data-i18n="options_export"
            data-i18n-attr="aria-label:options_export"
            aria-label="データをエクスポート"
          >
            データをエクスポート
          </button>
          <button
            type="button"
            id="btn-import"
            class="btn btn--secondary"
            data-i18n="options_import"
            data-i18n-attr="aria-label:options_import"
            aria-label="データをインポート"
          >
            データをインポート
          </button>
          <input
            type="file"
            id="file-import"
            class="visually-hidden"
            accept="application/json,.json"
            data-i18n-attr="aria-label:options_import"
            aria-label="データをインポート"
          />
          <button
            type="button"
            id="btn-reset"
            class="btn btn--danger"
            data-i18n="options_reset"
            data-i18n-attr="aria-label:options_reset"
            aria-label="すべての記録を削除"
          >
            すべての記録を削除
          </button>
        </div>
      </section>

      <div class="footer">
        <button
          type="button"
          id="btn-save"
          class="btn btn--primary"
          data-i18n="options_save"
          data-i18n-attr="aria-label:options_save"
          aria-label="設定を保存"
        >
          設定を保存
        </button>
        <p
          id="save-status"
          class="footer__status"
          role="status"
          aria-live="polite"
        ></p>
      </div>
    </main>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
